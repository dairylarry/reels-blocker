<!doctype html><html><body>
<!-- The new-message screen. It carries an <article> whose header holds a text
     button with no icon — exactly R7's signature. Hiding it would take the
     focused recipient search field with it and drop the keyboard. -->
<article id="recipient-panel">
  <div role="button">Cancel</div>
  <div role="presentation">
    <input id="search" type="text" placeholder="Search">
  </div>
</article>
</body></html>
